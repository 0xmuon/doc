# three containers. db is postgres, api is fastapi, provider is the stand-in for charges and email.
#   docker compose up --build
# inside this network the api reaches postgres at host db, port 5432 (see DATABASE_URL).
# the api reaches the stand-in at http://provider:9000.
name: shopping-simple

# run all services
services:
  # run service
  db:
    image: postgres:17-alpine
    # postgres reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env
    # and creates that user and database the first time the volume is empty.
    env_file:
      - .env
    ports:
      # host:container. use localhost:5433 from a db client on your machine.
      - "5433:5432"
    volumes:
      # named volume. data stays after docker compose down, and goes away with down -v.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # run service
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
      # debugpy: attach VS Code with "Attach to API in Docker".
      - "5678:5678"
    # wait until postgres accepts connections, then start.
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
    # mount the code and reload when files change while developing.
    volumes:
      - ./app:/code/app
      - ./provider:/code/provider
      - ./tests:/code/tests
      - ./pytest.ini:/code/pytest.ini
      - ./pyproject.toml:/code/pyproject.toml
      - ./.coveragerc:/code/.coveragerc
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload

  # stand-in for charges and email.the api calls http://provider:9000.
  provider:
    build: .
    ports:
      # from your machine: http://localhost:9000/docs and PUT /mode/ok|fail|slow
      - "9000:9000"
    volumes:
      - ./provider:/code/provider
    command: ["uvicorn", "provider.main:app", "--host", "0.0.0.0", "--port", "9000", "--reload"]

volumes:
  postgres_data:
