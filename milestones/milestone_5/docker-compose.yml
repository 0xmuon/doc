# milestone 5 only. from this folder:
#   docker compose up --build
# docs: http://127.0.0.1:8015/docs
# postgres on your machine: localhost:5445  user shop  password shop  database shopping
name: shopping-m5

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8015:8000"
    depends_on:
      - db
    volumes:
      - ./app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
