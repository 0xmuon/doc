# casbin shape.the rules live in policy.csv,this file only says how a question is asked.

[request_definition]
r = role, user_id, resource, action, owner_id

[policy_definition]
p = role, resource, action, rule

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.role == p.role && r.resource == p.resource && r.action == p.action && (p.rule == "true" || eval(p.rule))
